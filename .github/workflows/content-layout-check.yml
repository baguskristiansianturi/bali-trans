name: Validate homepage structure

on:
  pull_request:
    branches:
      - preview/bali-trans
    paths:
      - "index.html"
      - "scripts/validate_content_layout.py"
      - ".github/workflows/content-layout-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static homepage checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate homepage structure
        run: python scripts/validate_content_layout.py
