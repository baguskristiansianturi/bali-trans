name: Validate Bali Trans preview JavaScript

on:
  push:
    branches:
      - preview/bali-trans
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/bali-directory.js
