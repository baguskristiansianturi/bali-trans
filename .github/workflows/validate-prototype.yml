name: Validate Bali Trans source structure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refactor/separate-assets-and-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)

      - name: Check route and content references
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const read = path => fs.readFileSync(path, 'utf8');
          const navigation = read('assets/js/navigation.js');
          const interactions = read('assets/js/interactions.js');
          const discovery = read('assets/js/views/discovery.js');
          const data = read('assets/js/data.js');
          const viewText = interactions.match(/const supportedViews = \[([^\]]+)\]/)?.[1] || '';
          const views = [...viewText.matchAll(/'([^']+)'/g)].map(match => match[1]);
          const routeCases = [...navigation.matchAll(/case '([^']+)'/g)].map(match => match[1]);
          const missingViews = views.filter(view => !routeCases.includes(view));
          function keysFromObject(source, name) {
            const start = source.indexOf('const ' + name + ' = {');
            if (start < 0) return [];
            const bodyStart = source.indexOf('{', start);
            const end = source.indexOf('\n            };', bodyStart);
            if (end < 0) return [];
            return [...source.slice(bodyStart, end).matchAll(/'((?:region|place|service|duration):[^']+)'\s*:/g)].map(match => match[1]);
          }
          const discoveryKeys = [...keysFromObject(discovery, 'pages'), ...keysFromObject(discovery, 'extraDestinationPages')];
          const metadataStart = navigation.indexOf('const destinationMetadata = {');
          const metadataEnd = navigation.indexOf('\n                };', metadataStart);
          const metadataKeys = metadataStart >= 0 && metadataEnd >= 0
            ? [...navigation.slice(metadataStart, metadataEnd).matchAll(/'((?:region|place|service|duration):[^']+)'\s*:/g)].map(match => match[1])
            : [];
          const missingMetadata = discoveryKeys.filter(key => !metadataKeys.includes(key));
          const searchKeys = [...new Set([...interactions.matchAll(/key:'((?:region|place|service|duration):[^']+)'/g)].map(match => match[1]))];
          const missingDiscovery = searchKeys.filter(key => !discoveryKeys.includes(key));
          const master = JSON.parse(read('content/bali-master-data.json'));
          const destinationIds = master.destinations.map(destination => destination.id);
          const duplicateDestinationIds = destinationIds.filter((id, index) => destinationIds.indexOf(id) !== index);
          const regionIds = master.editorial_regions.map(region => region.id);
          const adminAreaIds = master.administrative_areas.map(area => area.id);
          const categoryIds = master.activity_categories.map(category => category.id);
          const invalidRegions = master.destinations.filter(destination => !regionIds.includes(destination.region_id)).map(destination => destination.id);
          const invalidAdminAreas = master.destinations.filter(destination => destination.admin_area_id && !adminAreaIds.includes(destination.admin_area_id)).map(destination => destination.id);
          const invalidCategories = master.destinations.filter(destination => (destination.categories || []).some(category => !categoryIds.includes(category))).map(destination => destination.id);
          const missingFactDates = master.destinations.filter(destination => destination.fact_status !== 'UNVERIFIED' && !destination.last_checked).map(destination => destination.id);
          const factChecksWithoutSources = master.destinations.filter(destination => destination.fact_status === 'FACT_CHECK' && !(destination.source_urls || []).length).map(destination => destination.id);
          const articleData = data.slice(data.indexOf('const BALI_BLOGS = ['));
          const articleIds = [...articleData.matchAll(/id:\s*['"]([^'"]+)['"]/g)].map(match => match[1]);
          const duplicateArticleIds = articleIds.filter((id, index) => articleIds.indexOf(id) !== index);
          const searchArticleIds = [...interactions.matchAll(/articleId:'([^']+)'/g)].map(match => match[1]);
          const missingSearchArticles = searchArticleIds.filter(id => !articleIds.includes(id));
          const invalidMasterRoutes = master.destinations.filter(destination => destination.route).filter(destination => {
            const query = new URLSearchParams(destination.route.replace(/^\?/, ''));
            const view = query.get('page') || 'home';
            const item = query.get('item');
            return !views.includes(view)
              || (view === 'discovery' && !discoveryKeys.includes(item))
              || (view === 'blog-read' && !articleIds.includes(item));
          }).map(destination => destination.id);
          const articleSourceCount = (articleData.match(/sources: \[/g) || []).length;
          if (missingViews.length || missingDiscovery.length || invalidMasterRoutes.length || duplicateDestinationIds.length || invalidRegions.length || invalidAdminAreas.length || invalidCategories.length || missingFactDates.length || factChecksWithoutSources.length || missingMetadata.length || duplicateArticleIds.length || missingSearchArticles.length || articleSourceCount !== articleIds.length) {
            console.error(JSON.stringify({ missingViews, missingDiscovery, invalidMasterRoutes, duplicateDestinationIds, invalidRegions, invalidAdminAreas, invalidCategories, missingFactDates, factChecksWithoutSources, missingMetadata, duplicateArticleIds, missingSearchArticles, articleSourceCount, articleCount: articleIds.length }, null, 2));
            process.exit(1);
          }
          console.log('Checked ' + views.length + ' route types, ' + new Set(discoveryKeys).size + ' discovery keys, ' + metadataKeys.length + ' metadata keys, ' + master.destinations.filter(destination => destination.route).length + ' master routes, ' + master.destinations.length + ' master records, and ' + articleIds.length + ' sourced article IDs.');
          NODE

      - name: Install Chromium for browser smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install chromium

      - name: Run mobile browser smoke tests
        shell: bash
        run: node scripts/browser-smoke.mjs

      - name: Check all HTML assets, externalized CSS/JS, and CSS references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path(".")
          html_files = sorted(root.glob("*.html"))
          missing_html = []
          inline_styles = []
          inline_style_attrs = []
          inline_scripts = []
          inline_js_styles = []
          html_refs = 0
          for html_file in html_files:
              source = html_file.read_text(encoding="utf-8")
              if re.search(r"<style\b", source, re.I):
                  inline_styles.append(str(html_file))
              if re.search(r"\sstyle\s*=", source, re.I):
                  inline_style_attrs.append(str(html_file))
              for attrs, body in re.findall(r"<script\b([^>]*)>([\s\S]*?)</script\s*>", source, re.I):
                  if not re.search(r"\bsrc\s*=", attrs, re.I) and not re.search(r"application/ld\+json", attrs, re.I) and body.strip():
                      inline_scripts.append(str(html_file))
              refs = re.findall(r"(?:src|href)\s*=\s*[\"']([^\"']+)[\"']", source, re.I)
              for ref in refs:
                  if ref.startswith(("http://", "https://", "//", "mailto:", "tel:", "data:", "#", "?")):
                      continue
                  clean = ref.split("#", 1)[0].split("?", 1)[0]
                  if not clean or clean.startswith("/"):
                      continue
                  html_refs += 1
                  if not (html_file.parent / clean).is_file():
                      missing_html.append(f"{html_file}: {ref}")
          js_files = sorted((root / "assets" / "js").rglob("*.js"))
          for js_file in js_files:
              source = js_file.read_text(encoding="utf-8")
              if re.search(r"\bstyle\s*=\s*[\"']", source, re.I):
                  inline_js_styles.append(str(js_file))
          css_files = sorted((root / "assets" / "css").rglob("*.css"))
          missing_css = []
          css_refs = 0
          for css_file in css_files:
              source = css_file.read_text(encoding="utf-8")
              refs = re.findall(r"@import\s+(?:url\()?\s*[\"']?([^\"')\s]+)", source, re.I)
              refs += re.findall(r"url\(\s*[\"']?([^\"')]+)", source, re.I)
              for ref in refs:
                  ref = ref.strip().strip("\"'")
                  if not ref or ref.startswith(("http://", "https://", "//", "data:", "#", "/")):
                      continue
                  clean = ref.split("#", 1)[0].split("?", 1)[0]
                  css_refs += 1
                  if not (css_file.parent / clean).is_file():
                      missing_css.append(f"{css_file}: {ref}")
          sitemap_urls = set(re.findall(r"<loc>(.*?)</loc>", (root / "sitemap.xml").read_text(encoding="utf-8"), re.I))
          missing_sitemap = []
          site_base = "https://baguskristiansianturi.github.io/bali-trans/"
          for html_file in html_files:
              source = html_file.read_text(encoding="utf-8")
              if re.search(r'<meta\b[^>]*name=["\']robots["\'][^>]*content=["\'][^"\']*noindex', source, re.I):
                  continue
              canonical = re.search(r'<link\b[^>]*rel=["\']canonical["\'][^>]*href=["\']([^"\']+)', source, re.I)
              expected = canonical.group(1) if canonical else site_base + html_file.name
              if expected not in sitemap_urls:
                  missing_sitemap.append(f"{html_file}: {expected}")
          private_brand_pattern = re.compile(r"\b" + "BDM" + r"\s*Trans\b|" + "BDM" + "Trans" + r"(?:\.com)?", re.I)
          private_brand_refs = []
          text_extensions = {".html", ".md", ".json", ".js", ".css", ".txt", ".xml", ".yml", ".yaml"}
          for candidate in root.rglob("*"):
              if not candidate.is_file() or candidate.suffix.lower() not in text_extensions or ".git" in candidate.parts:
                  continue
              try:
                  source = candidate.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if private_brand_pattern.search(source):
                  private_brand_refs.append(str(candidate))
          problems = []
          if private_brand_refs: problems.append("Private pre-launch brand references in public files:\n" + "\n".join(private_brand_refs))
          if missing_sitemap: problems.append("Public HTML pages missing from sitemap:\n" + "\n".join(missing_sitemap))
          if missing_html: problems.append("Missing HTML assets:\n" + "\n".join(missing_html))
          if missing_css: problems.append("Missing CSS URLs/imports:\n" + "\n".join(missing_css))
          if inline_styles: problems.append("Inline style blocks remain:\n" + "\n".join(inline_styles))
          if inline_style_attrs: problems.append("Inline style attributes remain in HTML:\n" + "\n".join(inline_style_attrs))
          if inline_scripts: problems.append("Inline executable scripts remain:\n" + "\n".join(inline_scripts))
          if inline_js_styles: problems.append("Inline style attributes in JS-generated markup remain:\n" + "\n".join(inline_js_styles))
          if problems:
              raise SystemExit("\n".join(problems))
          print(f"Checked {len(html_files)} HTML pages, {html_refs} local HTML references, {len(css_files)} CSS files, {css_refs} local CSS references, and {len(sitemap_urls)} sitemap URLs; no inline styles/scripts in HTML or style attributes in JS-generated markup remain.")
          PY
