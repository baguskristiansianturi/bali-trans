name: Validate prototype structure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refactor/separate-assets-and-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)

      - name: Check local asset references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text()
          refs = re.findall(r'(?:src|href)="(\./assets/[^"]+)"', html)
          missing = [ref for ref in refs if not (Path(".") / ref[2:]).is_file()]
          if missing:
              raise SystemExit("Missing local assets: " + ", ".join(missing))
          print(f"Checked {len(refs)} local asset references.")
          PY
