<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow"><meta name="theme-color" content="#e8edf4">
<title>Pemesanan Watersport Tanjung Benoa | Bali Trans</title>
<meta name="description" content="Pilih tiket watersport Tanjung Benoa, jenis wisatawan, tanggal aktivitas, dan jumlah peserta sebelum mengirim permintaan pemesanan kepada Bali Trans.">
<link rel="stylesheet" href="./assets/css/pages/watersport-checkout.css">
<script src="./assets/js/watersport-pricing.js" defer></script>
    <link rel="stylesheet" href="./assets/css/watersport-polish.css">
<link rel="stylesheet" href="./assets/css/watersport-product-experience.css">
<link rel="stylesheet" href="./assets/css/watersport-checkout-glass.css">
</head>
<body>

<main>
<section class="panel">
<h1>Pemesanan watersport</h1>
<div class="flow-steps" aria-label="Alur pemesanan"><div class="flow-step"><b>1</b> Aktivitas & jadwal</div><div class="flow-step"><b>2</b> Data peserta</div><div class="flow-step"><b>3</b> Ringkasan</div></div>
<form id="watersportBookingForm">
<div class="grid">
<div class="section-heading">1. Aktivitas & jadwal</div>
<div class="field full"><label for="product">Aktivitas atau paket</label><select id="product" name="product" required>
<option value="banana-boat">Banana Boat</option><option value="parasailing">Parasailing Adventure</option><option value="jet-ski">Jet Ski dengan instruktur</option><option value="rolling-donut">Rolling Donut</option><option value="flying-fish">Flying Fish</option><option value="seawalker">Sea Walker</option><option value="scuba-diving">Scuba Diving</option><option value="snorkeling">Snorkeling</option><option value="flyboard">Flyboard</option><option value="wakeboard">Wakeboard</option><option value="glass-bottom-boat">Glass Bottom Boat + Pulau Penyu (per boat)</option><option value="package">Paket watersport A–H</option>
</select></div>
<div class="field full" data-package-wrap hidden><label for="packageCode">Pilih paket</label><select id="packageCode" name="packageCode"><option value="A">Paket A · Banana Boat, Parasailing, Jet Ski</option><option value="B">Paket B · Parasailing, Flying Fish, Banana Boat</option><option value="C">Paket C · Snorkeling, Banana Boat, Flying Fish</option><option value="D">Paket D · Scuba Diving, Parasailing, Banana Boat</option><option value="E">Paket E · Scuba Diving, Parasailing, Flying Fish</option><option value="F">Paket F · Scuba Diving, Parasailing, Rolling Donut</option><option value="G">Paket G · Sea Walker, Banana Boat, Parasailing</option><option value="H">Paket H · Snorkeling, Glass Bottom Boat + Pulau Penyu</option></select></div>
<div class="field"><label for="audience">Jenis wisatawan</label><select id="audience" name="audience" required><option value="domestic">Domestik / pemegang KITAS</option><option value="foreign">Wisatawan asing</option></select></div>
<div class="field"><label for="activityDate">Tanggal aktivitas</label><input id="activityDate" name="activityDate" type="date" required></div>
<div class="field"><label for="quantity" data-quantity-label>Jumlah peserta</label><input id="quantity" name="quantity" type="number" min="2" value="2" step="1" required></div>
<div class="section-heading">2. Data pemesan dan peserta</div>
<div class="field"><label for="buyerName">Nama pemesan</label><input id="buyerName" name="buyerName" autocomplete="name" required></div>
<div class="field"><label for="buyerPhone">Nomor telepon pemesan</label><input id="buyerPhone" name="buyerPhone" type="tel" autocomplete="tel" placeholder="+62..." required></div>
<div class="field full"><label class="checkrow"><input type="checkbox" name="forSomeone" value="yes"> Pemesanan untuk orang lain</label></div>
<div class="field" data-guest-fields hidden><label for="guestName">Nama tamu/peserta</label><input id="guestName" name="guestName" autocomplete="off"></div>
<div class="field" data-guest-fields hidden><label for="guestPhone">Nomor telepon tamu/peserta</label><input id="guestPhone" name="guestPhone" type="tel" autocomplete="off"></div>
<div class="field full"><label for="notes">Catatan (opsional)</label><textarea id="notes" name="notes" placeholder="Permintaan khusus atau informasi peserta"></textarea></div>
</div>
<input type="hidden" name="estimatedTotal" value="0">
<h2 class="bt-inline-5h2xn1">3. Ringkasan pesanan</h2><div class="summary" id="bookingSummary" aria-live="polite"></div>
<button class="primary" type="submit">Lanjutkan permintaan</button>
</form>
</section>
<section class="panel result" id="bookingResult" hidden><h2>Ringkasan permintaan</h2><pre></pre><button class="primary" type="button" id="copyBooking">Salin ringkasan</button></section>
</main>
<script src="./assets/js/pages/watersport-checkout.js"></script>
<script src="./assets/js/watersport-checkout-layout.js" defer></script>
</body></html>
