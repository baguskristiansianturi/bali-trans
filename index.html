<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex,follow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bali Trans | Private Transport Bali, Airport Transfers & Tours</title>
    <meta name="description" content="Find private transport in Bali with Bali Trans: airport transfers, port transfers, intercity rides and private day tours. Explore each service and request a quote for your trip.">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./assets/js/tailwind.config.js?v=20261025-1"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/styles.css?v=20261025-1">
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    
    <link rel="stylesheet" href="./assets/css/global-shell.css?v=20261025-1">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col pb-16 md:pb-0">

    <!-- TOP ANNOUNCEMENT BAR -->
    <div id="topAnnouncementBar" class="bg-[#EEF3FB] text-[#172B4D] border-b border-[#DCE5F2] text-xs sm:text-sm py-1.5 px-4 text-center font-medium flex justify-between items-center md:px-12">
        <div class="hidden md:flex items-center space-x-2">
            <span class="bg-white/20 px-2 py-0.5 rounded text-xs uppercase tracking-wider font-bold">Explore Bali</span>
            <span>🌴 Discover Bali tours, island trips and private transport.</span>
        </div>
        <div class="w-full md:w-auto flex items-center justify-between md:justify-end space-x-4 text-xs">
            <span id="countdownTimer" class="font-bold">Plan your Bali trip</span>
            <div class="flex items-center space-x-3 border-l border-white/30 pl-3">
                <span id="topLiveChatStatus" class="inline-flex items-center gap-1.5 rounded-full border border-white/20 bg-white/10 px-2 py-1 text-[11px] font-semibold leading-none whitespace-nowrap" role="status" aria-live="polite"><span id="topLiveChatDot" class="h-2 w-2 rounded-full bg-slate-300"></span><i class="far fa-comments"></i><span id="topLiveChatLabel">Live Chat</span><span aria-hidden="true">·</span><span id="topLiveChatState">Offline</span></span>
            </div>
        </div>
    </div>

    <!-- MAIN VIEW CONTAINER (SINGLE PAGE APPLICATION RENDERER) -->
    <main id="appContainer" class="flex-1">
        <!-- Dynamic Views will be injected here via JavaScript -->
    </main>

    <!-- MOBILE BOTTOM NAVIGATION BAR (bali MOBILE STYLE) -->
    <div id="mobileBottomNavigation" class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 py-1.5 px-6 flex justify-between items-center shadow-lg">
        <button onclick="navigateTo('home')" class="flex flex-col items-center gap-1 text-slate-600 hover:text-bali-orange focus:text-bali-orange">
            <i class="fas fa-compass text-lg"></i>
            <span class="text-[10px] font-bold">Explore</span>
        </button>
        <button onclick="navigateTo('packages')" class="flex flex-col items-center gap-1 text-slate-600 hover:text-bali-orange focus:text-bali-orange">
            <i class="fas fa-th-large text-lg"></i>
            <span class="text-[10px] font-bold">Activities</span>
        </button>
        <button onclick="navigateTo('blog')" class="flex flex-col items-center gap-1 text-slate-600 hover:text-bali-orange focus:text-bali-orange">
            <i class="fas fa-book-open text-lg"></i>
            <span class="text-[10px] font-bold">Guides</span>
        </button>
        <button onclick="navigateTo('cart')" class="relative flex flex-col items-center gap-1 text-slate-600 hover:text-bali-orange focus:text-bali-orange">
            <i class="fas fa-shopping-bag text-lg"></i>
            <span id="mobileCartBadge" class="absolute -top-1 right-2 bg-bali-orange text-white text-[9px] font-extrabold w-4 h-4 rounded-full flex items-center justify-center">0</span>
            <span class="text-[10px] font-bold">Cart</span>
        </button>
    </div>

    <!-- TOAST NOTIFICATION BOX -->
    <div id="toastContainer" class="fixed bottom-20 md:bottom-8 right-4 md:right-8 z-50 space-y-2 pointer-events-none"></div>

    <!-- WISHLIST MODAL -->
    <div id="wishlistModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl p-6 relative max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <h3 class="text-lg font-extrabold text-slate-900 flex items-center gap-2">
                    <i class="fas fa-heart text-rose-500"></i> My Wishlist Saved Packages
                </h3>
                <button onclick="toggleWishlistModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center font-bold">✕</button>
            </div>
            <div id="wishlistItemsList" class="flex-1 overflow-y-auto py-4 space-y-3">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT APPLICATION LOGIC -->
        <script src="./assets/js/data.js?v=20261025-1"></script>
    <script src="./assets/js/state.js?v=20261025-1"></script>
    <script src="./assets/js/navigation.js?v=20261025-1"></script>
    <script src="./assets/js/views/static-pages.js?v=20261025-1"></script>
    <script src="./assets/js/views/discovery.js?v=20261025-1"></script>
    <script src="./assets/js/views/home.js?v=20261025-1"></script>
    <script src="./assets/js/views/catalog.js?v=20261025-1"></script>
    <script src="./assets/js/views/detail.js?v=20261025-1"></script>
    <script src="./assets/js/views/articles.js?v=20261025-1"></script>
    <script src="./assets/js/views/cart.js?v=20261025-1"></script>
    <script src="./assets/js/views/checkout.js?v=20261025-1"></script>
    <script src="./assets/js/interactions.js?v=20261025-1"></script>
    <script src="./assets/js/global-shell.js?v=20261025-1"></script>
    <script src="./assets/js/boot-recovery.js?v=20261025-1"></script>
</body>
</html>
